name: Quality Gate — Auditoria de Acessibilidade (Cypress + Cucumber + OpenAI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  a11y-quality-gate:
    name: 🛡️ Quality Gate WCAG 2.2 (Motor Externo de QA + IA)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código do Sistema (Front-end Dev)
        uses: actions/checkout@v4
        with:
          path: app-frontend

      - name: 🛡️ Checkout do Motor de Auditoria de QA (a11y-cypress-ia)
        uses: actions/checkout@v4
        with:
          repository: AngeloFDiasGTech/a11y-cypress-ia
          path: qa-audit-engine

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Instalar dependências do Motor de QA (Cypress + Cucumber + OpenAI)
        working-directory: qa-audit-engine
        run: |
          # Remove UTF-8 BOM de todos os arquivos JSON/JS/Feature caso tenham sido salvos no Windows com BOM
          node -e '
            const fs = require("fs");
            const files = [
              "package.json",
              "package-lock.json",
              "cypress.config.js",
              "cypress/e2e/features/a11y.feature",
              "cypress/e2e/steps/a11ySteps.js",
              "cypress/support/e2e.js",
              "cypress/support/commands.js"
            ];
            for (const f of files) {
              if (fs.existsSync(f)) {
                const content = fs.readFileSync(f, "utf8").replace(/^\uFEFF/, "");
                fs.writeFileSync(f, content, { encoding: "utf8" });
              }
            }
          '
          npm install

      - name: 🚀 Subir Aplicação do Dev e Executar Motor de Auditoria de QA
        run: |
          # 1. Sobe o front-end do desenvolvedor em background na porta 8080
          npx --yes http-server ./app-frontend -p 8080 -c-1 --silent &
          SERVER_PID=$!

          # Aguarda o servidor responder
          for i in $(seq 1 15); do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "✅ Aplicação Front-end rodando em http://localhost:8080"
              break
            fi
            sleep 1
          done

          # 2. Executa a suíte Cypress + Cucumber + OpenAI do repositório de QA apontando para a aplicação
          cd qa-audit-engine
          CYPRESS_URL_DO_PR="http://localhost:8080" npm run test:headless
          EXIT_CODE=$?

          kill $SERVER_PID || true
          exit $EXIT_CODE
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: 📊 Publicar Laudo de Acessibilidade no GitHub Job Summary
        if: always()
        run: |
          echo "## 🤖 Relatório de Auditoria de Acessibilidade (WCAG 2.2 + OpenAI GPT-4o)" >> $GITHUB_STEP_SUMMARY
          echo "*Motor de Auditoria: \`AngeloFDiasGTech/a11y-cypress-ia\`*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "qa-audit-engine/cypress/reports/a11y-report.md" ]; then
            cat qa-audit-engine/cypress/reports/a11y-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Nenhum relatório da IA foi gerado (verifique os logs do Cypress)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💬 Comentar Laudo da IA diretamente no Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'qa-audit-engine/cypress/reports/a11y-report.md';
            let reportContent = '⚠️ Não foi possível gerar o laudo da IA. Verifique a execução do Cypress nos logs da pipeline.';
            let isApproved = false;

            if (fs.existsSync(path)) {
              reportContent = fs.readFileSync(path, 'utf8');
              isApproved = !reportContent.includes('[VIOLAÇÃO CRÍTICA]') && reportContent.includes('[ACESSÍVEL]');
            }

            const statusBadge = isApproved
              ? '### ✅ Quality Gate Aprovado — Código Acessível (WCAG 2.2)'
              : '### ❌ Quality Gate Reprovado — Violação Crítica de Acessibilidade Detectada';

            const body = [
              '## 🤖 Auditoria Automática de Acessibilidade (Cypress + Cucumber + IA)',
              statusBadge,
              '',
              '> 🛡️ **Governança Shift-Left:** Auditoria executada pelo motor externo de QA [`AngeloFDiasGTech/a11y-cypress-ia`](https://github.com/AngeloFDiasGTech/a11y-cypress-ia).',
              '',
              '---',
              '',
              reportContent,
              '',
              '---',
              `*Auditoria executada no commit \`${context.sha.substring(0, 7)}\` pela esteira de Shift-Left Accessibility da **QAfé Academy**.*`
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: 📸 Upload de Screenshots e Relatórios (Artefatos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e-evidencias-a11y
          path: |
            qa-audit-engine/cypress/reports/
            qa-audit-engine/cypress/screenshots/
          if-no-files-found: ignore
